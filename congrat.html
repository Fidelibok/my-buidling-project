<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>

    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  list-style: none;
  text-decoration: none;
}

:root {
  --bs-light: #ffffff;
  --bs-dark: #000000;
  --bs-gold: #cbad00;
  --bs-gray: #2a2a28;
  --bs-dark-gray: #141414;

}

@font-face {
  font-family: sephora;
  src: url(/font/Sephora\ &\ Hayden.ttf);
}

.container {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  min-height: 100vh;
}

.wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  height: 200px;
  box-shadow: 1px 3px 2px 1px rgba(130, 130, 130, 0.5);
  padding: 20px;
  border-radius: 10px;
}

h2 {
  font-size: 2em;
  text-transform: uppercase;
  margin: 0 0 40px 0;
  font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}

p {
  font-family: sans-serif;
  font-size: 1.1em;
  width: 70%;
  text-align: center;
  line-height: 2;
  text-transform: capitalize;
}

a {
  font-size: 1.2em;
  font-family: sans-serif;
  color: var(--bs-gold);
  transition: .2s;
  text-transform: capitalize;
}

a:hover {
  color: var(--bs-gray);
}
  </style>
</head>
<body>

  <div class="container">

    <div class="wrap">

      <h2>registration successful</h2>

    <p>thank you for your request, we will get back to your shortly</p>

    <a href="index.html">okay</a>
    </div>
  </div>
  
</body>
</html>
